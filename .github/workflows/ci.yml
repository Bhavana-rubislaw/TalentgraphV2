name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talentgraph_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend2
        run: pip install -r requirements.txt

      - name: Create recommender database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE talentgraph_recommender;"

      # A handful of tests (resume parsing, meetings) exercise real login
      # flows against fixed seed accounts (e.g. sarah.anderson@email.com)
      # rather than mocking auth. The postgres service above starts empty,
      # so those accounts have to be created before pytest runs. Seeding
      # and testing must run as the same step/job so the SEED_ADMIN_PASSWORD
      # below is what both sides resolve to.
      - name: Initialize schema and seed test data
        working-directory: backend2
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentgraph_v2
          RECOMMENDER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentgraph_recommender
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD || 'ci-local-test-password-1' }}
        run: |
          python -c "from app.database import init_db; init_db()"
          python scripts/test_data/seed_data_v2.py

      - name: Run test suite
        working-directory: backend2
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentgraph_v2
          RECOMMENDER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentgraph_recommender
          WORKERS_ENABLED: "false"
          RECOMMENDER_ENABLED: "false"
          # Several tests re-authenticate per test case via TestClient, which
          # shares one fake IP for all requests - real per-IP login/signup
          # rate limits would false-positive well before the suite finishes.
          RATE_LIMITING_ENABLED: "false"
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD || 'ci-local-test-password-1' }}
        run: pytest tests/ -q

  frontend:
    name: Frontend (build + smoke tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend2/package-lock.json

      - name: Install dependencies
        working-directory: frontend2
        run: npm ci

      - name: Build
        working-directory: frontend2
        run: npm run build

      - name: Smoke tests
        working-directory: frontend2
        run: npm run test:smoke

      # Not a blocking gate yet: ~70 pre-existing type errors predate this CI
      # setup (corrupted legacy files, unrelated stale test fixtures, etc.)
      # and aren't part of any change this workflow is meant to guard. This
      # step still runs on every PR so regressions are visible in the log,
      # without blocking merges on debt nobody introduced. Flip
      # continue-on-error off once that baseline is paid down to zero.
      - name: Typecheck (informational)
        working-directory: frontend2
        run: npm run typecheck
        continue-on-error: true
